<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="splitzeCircleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
    <linearGradient id="tealGrad" x1="60" y1="40" x2="360" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05B2DC" />
      <stop offset="100%" stop-color="#0093B5" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="160" y1="220" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132D54" />
      <stop offset="100%" stop-color="#0B1D3A" />
    </linearGradient>
    <linearGradient id="checkFoldGrad" x1="276" y1="215" x2="355" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFD6DF" />
      <stop offset="65%" stop-color="#F1F4F8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <g clip-path="url(#splitzeCircleClip)">
    <!-- Base Deep Navy Circle -->
    <rect x="0" y="0" width="512" height="512" fill="url(#navyGrad)" />

    <!-- Upper-Left Teal Region -->
    <path
      d="M 0 0 L 512 0 L 512 135 L 341 245 L 284 167 Q 158 192 27 320 L 0 348 Z"
      fill="url(#tealGrad)"
    />

    <!-- White Sweeping Left Curve Ribbon -->
    <path
      d="M 15 358 Q 148 214 307 199 L 284 167 Q 138 186 0 330 Z"
      fill="#FFFFFF"
    />

    <!-- Checkmark Ribbon with Subtle Silver Fold -->
    <path
      d="M 276 216 L 339 302 L 495 190 L 474 159 L 341 245 L 308 202 Z"
      fill="url(#checkFoldGrad)"
    />

    <!-- Crisp White Right Ascender of the Checkmark -->
    <path
      d="M 339 302 L 495 190 L 474 159 L 341 245 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
