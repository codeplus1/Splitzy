<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="splitzyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E0D25" />
      <stop offset="100%" stop-color="#3B0412" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="72%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#EDA6B4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#EDA6B4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded Squircle Background matching w-8 h-8 rounded-[10px] from-[#6E0D25] to-[#3B0412] -->
  <rect x="8" y="8" width="496" height="496" rx="148" fill="url(#splitzyBg)" stroke="#7D1831" stroke-width="16" />
  <rect x="8" y="8" width="496" height="496" rx="148" fill="url(#roseGlow)" />

  <!-- Bold White "S" Emblem -->
  <text
    x="248"
    y="286"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="252"
    font-weight="800"
    letter-spacing="-6"
  >S</text>

  <!-- Soft Rose 4-Point Star Sparkle (✦) at top-right of S -->
  <path
    d="M358 88 C362 114, 370 122, 396 126 C370 130, 362 138, 358 164 C354 138, 346 130, 320 126 C346 122, 354 114, 358 88 Z"
    fill="#EDA6B4"
  />

  <!-- "Splitzy" Wordmark underneath -->
  <text
    x="256"
    y="404"
    text-anchor="middle"
    fill="#FFFFFF"
    fill-opacity="0.92"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="82"
    font-weight="700"
    letter-spacing="-2"
  >Splitzy</text>
</svg>
