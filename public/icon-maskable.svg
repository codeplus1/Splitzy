<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="splitzeMaskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152436" />
      <stop offset="50%" stop-color="#101D2D" />
      <stop offset="100%" stop-color="#0B1420" />
    </linearGradient>
    <radialGradient id="mintMaskGlow" cx="74%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#63E6BE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#63E6BE" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background in Primary Navy (#101D2D) for Android maskable safe zone -->
  <rect width="512" height="512" fill="url(#splitzeMaskBg)" />
  <rect width="512" height="512" fill="url(#mintMaskGlow)" />

  <!-- Centered within 80% safe zone -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Upper Split S Ribbon — Mint Green (#63E6BE) -->
    <path
      d="M336 112 H200 C160.235 112 128 144.235 128 184 C128 223.765 160.235 256 200 256 H298"
      fill="none"
      stroke="#63E6BE"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M298 78 L350 112 L298 146"
      fill="none"
      stroke="#63E6BE"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower Even S Ribbon — Crisp White (#FFFFFF) -->
    <path
      d="M176 352 H312 C351.765 352 384 319.765 384 280 C384 240.235 351.765 208 312 208 H214"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
      transform="translate(0, 48)"
    />
    <path
      d="M214 318 L162 352 L214 386"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      transform="translate(0, 48)"
    />

    <!-- "Splitze" Wordmark underneath -->
    <text
      x="256"
      y="464"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="68"
      font-weight="800"
      letter-spacing="-1.5"
    >Split<tspan fill="#63E6BE">ze</tspan></text>
  </g>
