<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="maskCircleClip">
      <circle cx="256" cy="256" r="196" />
    </clipPath>
    <linearGradient id="tealGradMask" x1="60" y1="40" x2="360" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05B2DC" />
      <stop offset="100%" stop-color="#0093B5" />
    </linearGradient>
    <linearGradient id="navyGradMask" x1="160" y1="220" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132D54" />
      <stop offset="100%" stop-color="#0B1D3A" />
    </linearGradient>
    <linearGradient id="checkFoldGradMask" x1="276" y1="215" x2="355" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFD6DF" />
      <stop offset="65%" stop-color="#F1F4F8" />
      <stop offset="100%" stop-color="#FFFFFF" />
