<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background rectangle extending to edge without border radius -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center Card Badge scaled within 80% safe zone (center at 256, 256) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <g filter="url(#dropShadowMask)">
      <rect x="96" y="96" width="320" height="320" rx="48" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
    </g>

    <!-- Upper Left Coin -->
    <circle cx="200" cy="200" r="44" fill="url(#goldGradMask)" />
    <circle cx="200" cy="200" r="36" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <path d="M188 184 V216 M212 184 V216 M188 200 H212" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Lower Right Peer Coin -->
    <circle cx="312" cy="312" r="44" fill="url(#goldGradMask)" />
    <circle cx="312" cy="312" r="36" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <path d="M300 296 V328 M324 296 V328 M300 312 H324" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Split / Balance Loop Arrows -->
    <path d="M256 180 C 290 180, 312 200, 312 240" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <polygon points="304,242 320,242 312,258" fill="#ffffff" />

    <path d="M256 332 C 222 332, 200 312, 200 272" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <polygon points="208,270 192,270 200,254" fill="#ffffff" />

    <!-- Center Balance Dot -->
    <circle cx="256" cy="256" r="14" fill="#34d399" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>
